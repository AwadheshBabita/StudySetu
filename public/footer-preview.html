<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamSewa - प्रीमियम मास्टर डायरेक्टरी डिज़ाइन डेमो</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4 font-sans flex flex-col justify-center items-center">

  <div class="max-w-4xl w-full text-center space-y-2 mb-6">
    <span class="px-3 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded-full">नया डिज़ाइन प्रिव्यू</span>
    <h2 class="text-xl font-black text-slate-800">मास्टर डायरेक्टरी - गोल्डन/ब्राउन प्रीमियम लुक</h2>
    <p class="text-xs text-slate-500">हरे कार्ड के नीचे और नीले कार्ड्स के ऊपर यह सेक्शन ऐसा दिखेगा:</p>
  </div>

  <!-- 💥 नया मास्टर डायरेक्टरी कार्ड (स्क्रीनशॉट के अनुसार) -->
  <div class="max-w-3xl w-full rounded-3xl p-6 sm:p-8 text-center shadow-xl border border-amber-900/30 relative overflow-hidden" 
       style="background: radial-gradient(circle at 50% 20%, #3d1b06 0%, #200d02 60%, #120701 100%);">
    
    <!-- शीर्ष बैज (Pill Badge) -->
    <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-[11px] font-bold tracking-wide border border-amber-500/40 bg-amber-500/10 text-amber-300 shadow-inner mb-4">
      <span>📑</span> ALL-IN-ONE DIRECTORY
    </div>

    <!-- मुख्य शीर्षक (Bold Crisp White) -->
    <h3 class="text-2xl sm:text-3xl font-black text-white tracking-tight leading-snug">
      सभी मास्टर टूल्स डायरेक्टरी
    </h3>

    <!-- सब-टाइटल (Warm Gold Accent) -->
    <p class="text-xs sm:text-sm text-amber-100/70 font-medium mt-2 max-w-lg mx-auto leading-relaxed">
      सरकारी एग्जाम, फॉर्म व कैफे के सभी टूल्स की पूरी सूची
    </p>

    <!-- फ़िल्टर टैब्स (Pills / Glass Effect) -->
    <div class="mt-6 flex items-center justify-center gap-2 overflow-x-auto pb-1 no-scrollbar flex-wrap">
      
      <!-- एक्टिव बटन (सक्रिय टैब) -->
      <button class="px-3.5 py-1.5 text-xs font-bold rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 shadow-md flex items-center gap-1 cursor-pointer">
        ✓ सभी
      </button>

      <!-- अन्य बटन्स (ग्लास स्टाइल) -->
      <button class="px-3.5 py-1.5 text-xs font-semibold rounded-xl bg-white/10 hover:bg-white/15 text-amber-100/90 border border-white/10 backdrop-blur-md transition flex items-center gap-1 cursor-pointer">
        <span>📷</span> फोटो व साइन
      </button>

      <button class="px-3.5 py-1.5 text-xs font-semibold rounded-xl bg-white/10 hover:bg-white/15 text-amber-100/90 border border-white/10 backdrop-blur-md transition flex items-center gap-1 cursor-pointer">
        <span>🪪</span> डॉक्यूमेंट व कार्ड
      </button>

      <button class="px-3.5 py-1.5 text-xs font-semibold rounded-xl bg-white/10 hover:bg-white/15 text-amber-100/90 border border-white/10 backdrop-blur-md transition flex items-center gap-1 cursor-pointer">
        <span>📄</span> PDF टूल्स
      </button>

      <button class="px-3.5 py-1.5 text-xs font-semibold rounded-xl bg-white/10 hover:bg-white/15 text-amber-100/90 border border-white/10 backdrop-blur-md transition flex items-center gap-1 cursor-pointer">
        <span>⚙️</span> यूटिलिटीज
      </button>

    </div>

  </div>

  <p class="text-xs text-slate-400 mt-6 text-center">नीचे इसके बाद आपके नीले कार्ड्स शुरू होंगे।</p>

</body>
</html>
